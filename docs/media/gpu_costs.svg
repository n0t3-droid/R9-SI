<rect class="bg" x="0.5" y="0.5" width="719" height="371" rx="12" fill="#ffffff" stroke="#e3e7ee"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1b2130">Was ein Bild kostet · what a frame costs</text>
<text x="20" y="49" font-size="12" fill="#5b6478">AMD Radeon (Ryzen APU), Ultra, a town at night — the game measuring itself with /kosten</text>
<text x="290.0" y="81.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Sichtweite 16 → 12</text><text x="163.2" y="81.0" font-size="11" text-anchor="end" fill="#5b6478">view distance</text><rect x="300" y="66" width="295.6" height="22" rx="4" fill="#e0752f"/><text x="603.6" y="81.0" font-size="12" font-weight="700" fill="#1b2130">−21.5 ms</text><text x="290.0" y="113.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Wasser 2 → 1</text><text x="202.8" y="113.0" font-size="11" text-anchor="end" fill="#5b6478">water mirror</text><rect x="300" y="98" width="195.3" height="22" rx="4" fill="#e0752f"/><text x="503.3" y="113.0" font-size="12" font-weight="700" fill="#1b2130">−14.2 ms</text><text x="290.0" y="145.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Auflösung × 0,8</text><text x="183.0" y="145.0" font-size="11" text-anchor="end" fill="#5b6478">resolution</text><rect x="300" y="130" width="143.0" height="22" rx="4" fill="#e0752f"/><text x="451.0" y="145.0" font-size="12" font-weight="700" fill="#1b2130">−10.4 ms</text><text x="290.0" y="177.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Feines Laub aus</text><text x="183.0" y="177.0" font-size="11" text-anchor="end" fill="#5b6478">fancy leaves</text><rect x="300" y="162" width="129.3" height="22" rx="4" fill="#e0752f"/><text x="437.3" y="177.0" font-size="12" font-weight="700" fill="#1b2130">−9.4 ms</text><text x="290.0" y="209.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Schattenkarte 3 → 2</text><text x="156.6" y="209.0" font-size="11" text-anchor="end" fill="#5b6478">shadow map</text><rect x="300" y="194" width="64.6" height="22" rx="4" fill="#e0752f"/><text x="372.6" y="209.0" font-size="12" font-weight="700" fill="#1b2130">−4.7 ms</text><text x="290.0" y="241.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Material 3 → 2</text><text x="189.6" y="241.0" font-size="11" text-anchor="end" fill="#5b6478">materials</text><rect x="300" y="226" width="63.2" height="22" rx="4" fill="#e0752f"/><text x="371.3" y="241.0" font-size="12" font-weight="700" fill="#1b2130">−4.6 ms</text><text x="290.0" y="273.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Mini-Voxel 96 → 44</text><text x="163.2" y="273.0" font-size="11" text-anchor="end" fill="#5b6478">mini-voxel detail</text><rect x="300" y="258" width="37.1" height="22" rx="4" fill="#e0752f"/><text x="345.1" y="273.0" font-size="12" font-weight="700" fill="#1b2130">−2.7 ms</text><text x="290.0" y="305.0" font-size="12" text-anchor="end" font-weight="600" fill="#1b2130">Lichtstrahlen aus</text><text x="169.8" y="305.0" font-size="11" text-anchor="end" fill="#5b6478">light rays</text><rect x="300" y="290" width="34.4" height="22" rx="4" fill="#e0752f"/><text x="342.4" y="305.0" font-size="12" font-weight="700" fill="#1b2130">−2.5 ms</text><text x="20.0" y="340.0" font-size="11" fill="#5b6478">The whole frame: 95.1 ms of GPU time (opaque 40.9 · water 24.7 · plants 15.5 · far land 5.9).</text><text x="20.0" y="356.0" font-size="11" fill="#5b6478">Each row: one Ultra setting down one step, measured A/B/A on the real card. Lesson: quads are not where this GPU spends its time.</text>
</svg>
